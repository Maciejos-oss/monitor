<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test Supabase</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        #status {
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #ccc;
        }

        pre {
            background: #f4f4f4;
            padding: 15px;
            overflow: auto;
        }
    </style>
</head>

<body>

    <h1>Test połączenia z Supabase</h1>

    <div id="status">
        Łączenie...
    </div>

    <pre id="wynik"></pre>

<script>

const SUPABASE_URL = "https://jgtoikbjhqzxxotwrwpa.supabase.co";
const SUPABASE_KEY = "sb_publishable_E7mRiTRsoWRCUVCcAhDksQ_TpwI9stm";

async function testSupabase() {

    const status = document.getElementById("status");
    const wynik = document.getElementById("wynik");

    try {

        const url =
            `${SUPABASE_URL}/rest/v1/pomiary?select=*&limit=1`;

        const response = await fetch(url, {
            method: "GET",
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`
            }
        });

        const tekst = await response.text();

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}\n${tekst}`
            );
        }

        const dane = JSON.parse(tekst);

        status.innerHTML = "✅ Połączenie z Supabase działa";

        wynik.textContent =
            JSON.stringify(dane, null, 2);

    } catch (error) {

        status.innerHTML =
            "❌ Błąd połączenia";

        wynik.textContent =
            error.toString();

        console.error(error);
    }
}

testSupabase();

</script>

</body>
</html>
