<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test Supabase</title>
</head>

<body>

    <h1>Test połączenia z Supabase</h1>

    <div id="wynik">
        Testuję połączenie...
    </div>


<script>

const SUPABASE_URL =
    "https://jgtoikbjhqzxxotwrwpa.supabase.co";


async function test() {

    const wynik = document.getElementById("wynik");

    try {

        const response =
            await fetch(SUPABASE_URL);

        wynik.innerHTML =
            "✅ Supabase odpowiada<br><br>" +
            "HTTP: " +
            response.status;

    } 

    catch (error) {

        wynik.innerHTML =
            "❌ Brak połączenia<br><br>" +
            "Typ błędu: " +
            error.name +
            "<br><br>" +
            "Komunikat: " +
            error.message;

        console.error(error);
    }

}


test();

</script>

</body>

</html>
