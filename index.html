<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test Supabase</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            max-width: 1000px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .status {
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .ok {
            background: #e8f5e9;
        }

        .error {
            background: #ffebee;
        }

        .info {
            background: #e3f2fd;
        }

        pre {
            background: #f5f5f5;
            padding: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <h1>Test połączenia z Supabase</h1>

    <div id="status" class="status info">
        Rozpoczynam test...
    </div>

    <h2>Wynik</h2>

    <pre id="wynik"></pre>


<script>

// ==========================================================
// KONFIGURACJA
// ==========================================================

const SUPABASE_URL = "TUTAJ_WKLEJ_PROJECT_URL";

const SUPABASE_KEY = "TUTAJ_WKLEJ_PUBLISHABLE_LUB_ANON_KEY";

const TABELA = "pomiary";


// ==========================================================
// ELEMENTY HTML
// ==========================================================

const status = document.getElementById("status");
const wynik = document.getElementById("wynik");


// ==========================================================
// FUNKCJA POMOCNICZA
// ==========================================================

function pokazStatus(tekst, typ) {

    status.textContent = tekst;

    status.className = "status " + typ;
}


// ==========================================================
// TEST SUPABASE
// ==========================================================

async function testSupabase() {

    wynik.textContent = "";

    // ------------------------------------------------------
    // TEST 1 — sprawdzenie konfiguracji
    // ------------------------------------------------------

    if (
        SUPABASE_URL.includes("TUTAJ") ||
        SUPABASE_KEY.includes("TUTAJ")
    ) {

        pokazStatus(
            "❌ Nie uzupełniono danych Supabase",
            "error"
        );

        wynik.textContent =
            "Uzupełnij SUPABASE_URL oraz SUPABASE_KEY.";

        return;
    }


    // ------------------------------------------------------
    // TEST 2 — pokazanie adresu
    // ------------------------------------------------------

    pokazStatus(
        "🔄 Łączenie z Supabase...",
        "info"
    );

    const url =
        `${SUPABASE_URL}/rest/v1/${TABELA}?select=*&limit=1`;


    wynik.textContent =
        "Adres zapytania:\n" +
        url +
        "\n\n";


    // ------------------------------------------------------
    // TEST 3 — zapytanie HTTP
    // ------------------------------------------------------

    try {

        const response = await fetch(url, {

            method: "GET",

            headers: {

                "apikey": SUPABASE_KEY,

                "Authorization":
                    `Bearer ${SUPABASE_KEY}`

            }

        });


        // --------------------------------------------------
        // Odczyt odpowiedzi
        // --------------------------------------------------

        const tekst = await response.text();


        wynik.textContent +=
            "HTTP STATUS: " +
            response.status +
            "\n\n" +
            "ODPOWIEDŹ:\n" +
            tekst;


        // --------------------------------------------------
        // Sprawdzenie HTTP
        // --------------------------------------------------

        if (!response.ok) {

            pokazStatus(
                `❌ Supabase odpowiedział błędem HTTP ${response.status}`,
                "error"
            );

            return;
        }


        // --------------------------------------------------
        // Sukces
        // --------------------------------------------------

        pokazStatus(
            "✅ Połączenie z Supabase działa!",
            "ok"
        );

    }

    catch (error) {

        // --------------------------------------------------
        // Błąd przeglądarki / sieci / CORS
        // --------------------------------------------------

        pokazStatus(
            "❌ Nie udało się wykonać zapytania",
            "error"
        );


        wynik.textContent +=
            "\n\n" +
            "TYP BŁĘDU:\n" +
            error.name +
            "\n\n" +
            "KOMUNIKAT:\n" +
            error.message;


        console.error(error);
    }

}


// ==========================================================
// START
// ==========================================================

testSupabase();

</script>

</body>

</html>
